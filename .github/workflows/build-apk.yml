name: Build XuanXingNieHe APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      # 与仓库自带 test.yml 相同的 SDK 版本（compileSdk=36）
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # 逆核: 只出 arm64-v8a 的 debug 包。release 需要本地签名文件(release/*.jks)，
      # 仓库未含，故统一构建 assembleDebug。产物可直接安装。
      - name: Build debug APK (arm64)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xuanxingnihe-debug-apk
          path: app/build/outputs/apk/debug/
          if-no-files-found: error