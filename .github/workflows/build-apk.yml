name: Build XuanXingNieHe APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 逆核: 不用 android-actions/setup-android —— 它在 runner 上自动接受 license 会
      # 交互式卡住并 exit 1（7 of 8 licenses not accepted），导致后续步骤全部跳过。
      # 这里直接用 runner 预装的 Android SDK，手动装 compileSdk=36 所需组件并接受协议。
      - name: Set up Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CT="$SDK/cmdline-tools/16.0"
          if [ ! -x "$CT/bin/sdkmanager" ]; then
            curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt
            mkdir -p "$CT"
            mv /tmp/clt/cmdline-tools/* "$CT/"
          fi
          SM="$CT/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$SDK" > local.properties

      # 逆核: 只出 arm64-v8a 的 debug 包。release 需要本地签名文件(release/*.jks)，
      # 仓库未含，故统一构建 assembleDebug。产物可直接安装。
      # gradlew 在仓库里无执行位（工作区无法 chmod），统一用 bash 解释执行。
      - name: Build debug APK (arm64)
        run: bash ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xuanxingnihe-debug-apk
          path: app/build/outputs/apk/debug/
          if-no-files-found: error